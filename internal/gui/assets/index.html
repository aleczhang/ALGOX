<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ALGOX</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- the sidebar (app.js renderNav): the brand, the pages in groups, and
     Settings at its foot -->
<aside class="sidebar" id="side">
  <div class="side-top" style="--wails-draggable:drag">
    <div class="brand"><span class="logo"><img src="icons/favicon.svg" alt=""></span><span>ALGOX</span></div>
  </div>
  <nav class="side-scroll" id="nav" aria-label="Pages"></nav>
  <div class="side-foot" id="navFoot"></div>
</aside>
<div class="main">
  <header class="top" style="--wails-draggable:drag">
    <div class="crumb" id="crumb"></div>
  </header>
  <main class="page" id="page"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="pages/home.js"></script>
<script src="pages/settings.js"></script>
<script>App.start();</script>
</body>
</html>
